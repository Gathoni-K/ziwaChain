<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZiwaChain, Records for Collected Water Hyacinth</title>
  <meta name="description" content="Learn how ZiwaChain records collected water hyacinth and check a collection record.">
  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var urlTheme = params.get("theme");
        var theme = (urlTheme === "light" || urlTheme === "dark") ? urlTheme : (localStorage.getItem("ziwachain_theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
        var urlLang = params.get("lang");
        var lang = (urlLang === "en" || urlLang === "sw") ? urlLang : (localStorage.getItem("ziwachain_lang") || (navigator.language && navigator.language.startsWith("sw") ? "sw" : "en"));
        document.documentElement.setAttribute("lang", lang);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/react-main.tsx"></script>
</body>
</html>
